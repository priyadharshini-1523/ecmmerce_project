<!DOCTYPE html>
<html>
<head>
<title>Vendor Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
min-height:100vh;
background:linear-gradient(135deg,#f8fafc,#eef2f7);
}
.header{
width:100%;
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
background:rgba(255,255,255,0.75);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(0,0,0,0.06);
position:sticky;
top:0;
z-index:1000;
}
.header h3{
font-size:38px;
font-weight:700;
color:#1f2937;
}
#search{
width:320px;
padding:12px 18px;
border:none;
outline:none;
border-radius:999px;
background:white;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
font-size:15px;
}
button{
border:none;
outline:none;
padding:12px 24px;
border-radius:999px;
cursor:pointer;
font-size:15px;
font-weight:600;
transition:0.3s ease;
}

.header-buttons{
display:flex;
gap:15px;
}
.btn-primary{
background:linear-gradient(135deg,#7f5af0,#2cb67d);
color:white;
}
button:hover{
transform:translateY(-3px);
}
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
padding:45px;
}
.card{
background:#ffffff;
border-radius:25px;
padding:28px;
transition:0.35s ease;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
border:1px solid #eef2f7;
}
.card:hover{
transform:translateY(-6px);
box-shadow:0 18px 35px rgba(0,0,0,0.12);
}
.card h3{
font-size:26px;
font-weight:700;
color:#1f2937;
}
.price{
font-size:28px;
font-weight:700;
color:#2cb67d;
margin-top:12px;
}
.detail{
color:#6b7280;
margin-top:10px;
line-height:1.6;
}
.edit-btn{
width:100%;
margin-top:20px;
background:linear-gradient(135deg,#7f5af0,#2cb67d);
color:white;
}
.delete-btn{
width:100%;
margin-top:12px;
background:linear-gradient(135deg,#7f5af0,#2cb67d);
color:white;
}
.empty{
color:#6b7280;
font-size:24px;
text-align:center;
grid-column:1/-1;
margin-top:60px;
}
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
z-index:2000;
}
.modal-box{
width:420px;
background:white;
padding:30px;
border-radius:25px;
display:flex;
flex-direction:column;
gap:15px;
}
.modal-box h2{
text-align:center;
color:#222;
}
.modal-box input,
.modal-box textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
font-size:15px;
}
.modal-box textarea{
height:100px;
resize:none;
}
@media(max-width:768px){
.header{
flex-direction:column;
gap:18px;
padding:20px;
text-align:center;
}
.header h3{
font-size:30px;
}
.container{
padding:20px;
}
#search{
width:100%;
}
.header-buttons{
flex-direction:column;
width:100%;
}
.modal-box{
width:90%;
}
}
</style>
</head>
<body>
<div class="header">
<h3>Vendor Dashboard</h3>
<input type="text" id="search" placeholder="Search Products..." onkeyup="searchProducts()">
<div class="header-buttons">
<button class="btn-primary" onclick="goUpload()">Upload Product</button>
<button class="btn-primary" onclick="logout()">Logout</button>
</div>
</div>
<div class="container" id="container"></div>
<div id="editModal" class="modal">
<div class="modal-box">
<h2>Edit Product</h2>
<input type="text" id="editName" placeholder="Product Name">
<input type="number" id="editPrice" placeholder="Price">
<input type="text" id="editCategory" placeholder="Category">
<textarea id="editDetail" placeholder="Product Detail"></textarea>
<button class="edit-btn" onclick="updateProduct()">Update Product</button>
<button class="delete-btn" onclick="closeModal()">Cancel</button>
</div>
</div>
<script>
const token=sessionStorage.getItem("token")
if(!token){
window.location.href="../auth/login.html"
}
const container=document.getElementById("container")
let allProducts=[]
let editPid=null
async function loadProducts(){
try{
const res=await fetch("http://localhost:3000/product/myproducts",{headers:{"authorization":"Bearer "+token}})
const data=await res.json()
allProducts=data.data
displayProducts(allProducts)
}
catch(err){
console.log(err)
alert("Failed To Load Products")
}
}
function displayProducts(products){
container.innerHTML=""
if(!products||products.length===0){
container.innerHTML="<div class='empty'>No Products Found</div>"
return
}
products.forEach(p=>{
container.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
<div class="price">₹ ${p.price}</div>
<div class="detail">${p.detail}</div>
<button class="edit-btn" onclick="editProduct(${p.pid},'${p.name}','${p.price}',
'${p.category}','${p.detail}')">Edit Product</button>
<button class="delete-btn" onclick="deleteProduct(${p.pid})">Delete Product</button>
</div>`
})
}
function searchProducts(){
const search=document.getElementById("search").value.toLowerCase()
const filtered=allProducts.filter(p=>p.name.toLowerCase().includes(search))
displayProducts(filtered)
}
function editProduct(pid,name,price,category,detail){
editPid=pid
document.getElementById("editName").value=name
document.getElementById("editPrice").value=price
document.getElementById("editCategory").value=category
document.getElementById("editDetail").value=detail
document.getElementById("editModal").style.display="flex"
}
function closeModal(){
document.getElementById("editModal").style.display="none"
}
async function updateProduct(){
const name=document.getElementById("editName").value
const price=document.getElementById("editPrice").value
const category=document.getElementById("editCategory").value
const detail=document.getElementById("editDetail").value
try{
const res=await fetch(`http://localhost:3000/product/edit/${editPid}`,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"authorization":"Bearer "+token
},
body:JSON.stringify({name,price,category,detail})
})
const data=await res.json()
alert(data.message)
closeModal()
loadProducts()
}
catch(err){
console.log(err)
alert("Update Failed")
}
}

async function deleteProduct(pid){
if(!confirm("Delete this product?"))return
try{
const res=await fetch(`http://localhost:3000/product/${pid}`,{
method:"DELETE",
headers:{"authorization":"Bearer "+token}
})
const data=await res.json()
alert(data.message)
loadProducts()
}
catch(err){
console.log(err)
alert("Delete Failed")
}
}
function goUpload(){
window.location.href="upload.html"
}
function logout(){
sessionStorage.clear()
window.location.href="../auth/login.html"
}
loadProducts()
</script>
</body>
</html>
